name: Licence

# All of this repository is tooling, so every source file is MIT OR GPL-2.0-only,
# but for the ns-3 ports' consumer, which includes ns-3's GPL-only headers
# (LICENSING.md, test/consumer/ns3/).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@e660ccde85c1a0be00f9ca3ab8b5f19042b04519 # main@2026-11-26
    with:
      dual-roots: tools/ ports/ templates/ test/ .github/
      core-roots: ''
      gpl-only: test/consumer/ns3/consumer-ns3.cc
